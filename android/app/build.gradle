plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.kimyh1981.newsclipping'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.kimyh1981.newsclipping'
        minSdk 26
        targetSdk 34
        // versionCode는 배포 작업 번호: 새 APK를 받으면 기존 앱 위에 업데이트로 설치된다
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        // 보이는 버전은 android/version.txt (1.<PR 번호>). PR마다 올려서 머지 안내의 'PR #N (v1.N)'과 앱 화면 버전이 같게 한다
        versionName rootProject.file('version.txt').text.trim()
        // 뉴스 브리핑(언론사별 기사) 주소. 다른 곳에 배포하면 NEWS_URL 환경 변수로 바꾼다
        // F1 음성 엔진(ONNX Runtime)은 갤럭시(64비트 ARM)용만 넣는다: 앱 크기를 줄이려고
        ndk { abiFilters 'arm64-v8a' }
        buildConfigField 'String', 'NEWS_URL', "\"${System.getenv('NEWS_URL') ?: 'https://kimyh1981.github.io/newsclipping/briefing.json'}\""
    }

    buildFeatures {
        buildConfig true
    }

    // 업데이트 설치가 되려면 항상 같은 키로 서명해야 한다.
    //  release: 정식판. release.keystore (저장소에 공개, 비밀번호는 환경 변수로 바꿀 수 있다). 바꾸면 기존 사용자가 지우고 다시 깔아야 해서 그대로 둔다
    //  lite: 라이트판은 회사 밖에도 나눠 주므로 비공개 키 (2026-10-17). 저장소 비밀값 LITE_KEYSTORE_B64·LITE_KEYSTORE_PASSWORD를
    //        android.yml이 파일로 풀어 LITE_KEYSTORE에 넘긴다. 없으면(로컬 빌드) 정식판 키로 서명하고, main 배포는 막는다
    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'newsclipping'
            keyAlias 'newsclipping'
            keyPassword System.getenv('KEYSTORE_PASSWORD') ?: 'newsclipping'
        }
        if (System.getenv('LITE_KEYSTORE')) {
            lite {
                storeFile file(System.getenv('LITE_KEYSTORE'))
                storeType 'pkcs12'
                storePassword System.getenv('LITE_KEYSTORE_PASSWORD')
                keyAlias 'lite'
                keyPassword System.getenv('LITE_KEYSTORE_PASSWORD')
            }
        }
    }

    // 배포판 두 가지 (주인 요청 2026-10-17). 같은 코드로 함께 빌드해서 공통 수정은 두 앱에 똑같이 들어간다.
    //  full: 지금 쓰는 앱 그대로 (바이오플랜 제품 공부·농업영어 포함)
    //  lite: '뉴스클리핑 라이트'. 제품 공부·농업영어를 뺀다. 앱 ID가 달라 정식판과 따로 설치된다.
    //        보이는 버전은 android/version-lite.txt: 제품 공부·농업영어만 바뀐 PR은 이 파일을 올리지 않아 라이트에는 업데이트가 뜨지 않는다
    flavorDimensions 'edition'
    productFlavors {
        full {
            dimension 'edition'
            manifestPlaceholders = [appLabel: '뉴스클리핑']
            buildConfigField 'boolean', 'LESSONS', 'true'
            buildConfigField 'String', 'APK_NAME', '"newsclipping.apk"'
            signingConfig signingConfigs.release
        }
        lite {
            dimension 'edition'
            applicationIdSuffix '.lite'
            versionName rootProject.file('version-lite.txt').text.trim()
            manifestPlaceholders = [appLabel: '뉴스클리핑 라이트']
            buildConfigField 'boolean', 'LESSONS', 'false'
            buildConfigField 'String', 'APK_NAME', '"newsclipping-lite.apk"'
            signingConfig System.getenv('LITE_KEYSTORE') ? signingConfigs.lite : signingConfigs.release
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // F1 음성(Supertonic-3)을 폰에서 만드는 엔진
    // 1.23.x는 SME만 있고 SME2는 없는 최신 스냅드래곤(8 Elite Gen 5)에서 모델을 열다 SIGILL로 죽는다 (주인 폴드8, 2026-10-17 앱 종료 기록).
    // 상위 버그 microsoft/onnxruntime#26377, 1.24.4부터 고침
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
    testImplementation 'junit:junit:4.13.2'
    // 안드로이드에 들어 있는 org.json을 JVM 단위 테스트에서도 쓰려면 실제 구현이 필요하다
    testImplementation 'org.json:json:20240303'
}
