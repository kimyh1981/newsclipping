# 새벽 원고 자명종: GitHub 예약 실행은 몇 시간씩 늦게 오거나 빠져서(2026-10-08엔 아침 8시가 넘도록 안 옴)
# 전날 밤에 미리 깨어나 기다렸다가, 한국 시간 새벽 4시 40분과 5시 50분에 'Deploy news site'를 직접 돌린다.
# 밤 예약이 몇 시간 늦어도 새벽 시각에 맞출 수 있게 여러 번 걸어 두고, 새로 깬 것이 앞서 기다리던 것을 대신한다.
name: Morning alarm

on:
  schedule:
    - cron: '17 14 * * *' # 한국 시간 밤 11시 17분
    - cron: '47 15 * * *'
    - cron: '17 17 * * *'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: alarm
  cancel-in-progress: true

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Wait for dawn, then build today's briefing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=$(date -u +%s)
          day=$(date -u +%F)
          ran=0
          for at in 19:40 20:50; do # UTC = 한국 04:40, 05:50
            target=$(date -u -d "$day $at" +%s)
            now=$(date -u +%s)
            wait=$((target - now))
            # 이 작업은 6시간까지만 돈다: 그 안에 못 닿는 시각은 다음 예약에 맡긴다
            if [ $((now - start + wait)) -gt $((345 * 60)) ]; then echo "$at UTC까지 너무 멀어 건너뜀"; continue; fi
            if [ $wait -lt 0 ]; then
              # 예약이 늦게 와서 시각이 지났으면 한 번만 바로 돌린다. 아침 7시(22:00 UTC)가 넘었어도 오늘 원고가 아직 없으면 돌린다
              # (2026-10-13: 밤 11시 자명종이 아침 7시 8분에야 와서 그냥 건너뛰는 바람에 그날 원고가 없었다)
              [ $ran = 1 ] && continue
              if [ $now -gt $(date -u -d "$day 22:00" +%s) ]; then
                live=$(curl -fsS "https://kimyh1981.github.io/newsclipping/briefing.json" | jq -r '.generatedAt // empty' 2>/dev/null || true)
                live_day=$( [ -n "$live" ] && TZ=Asia/Seoul date -d "$live" +%F || true)
                [ "$live_day" = "$(TZ=Asia/Seoul date +%F)" ] && { echo "$at UTC가 이미 지났고 오늘 원고도 있음"; continue; }
                echo "$at UTC가 지났지만 오늘 원고가 없어 지금 만듦 (지금 원고: ${live_day:-없음})"
              fi
            else
              echo "$at UTC까지 $((wait / 60))분 기다림"
              sleep $wait
            fi
            gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
            ran=1
          done
