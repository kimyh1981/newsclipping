# 뉴스클리핑 웹(기사 목록·음성 원고)을 GitHub Pages에 배포한다: kimyh1981.github.io/newsclipping/
name: Deploy news site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 한국 시간 새벽 4시 30분부터 6시까지 여러 번 오늘의 원고를 만든다 (앱은 6~8시에 읽는다).
    # GitHub 일정은 늦어지거나 빠지는 일이 있어 한 번만 걸어 두면 어제 원고가 남는다
    - cron: '30 19 * * *'
    - cron: '0 20 * * *'
    - cron: '20 20 * * *'
    - cron: '40 20 * * *'
    - cron: '0 21 * * *'
    # 오후 원고(많이 본 뉴스, 주인 요청 2026-10-14): 한국 시간 오후 4시 20분부터 5시 20분까지, 6시 전에 끝나게
    - cron: '20 7 * * *'
    - cron: '50 7 * * *'
    - cron: '20 8 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 원고 만들기(수집·녹음)는 서로 끊지 않는다: 첫 녹음이 십여 분 걸려 다음 예약이 오면 끊기고, 녹음 캐시도 남지 않았다
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Test
        run: npm test
      - name: Site files
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest js icons _site/
          # 휴대폰 브라우저가 예전 스크립트를 붙잡고 있지 않게, 배포마다 스크립트 주소에 버전을 붙인다
          sed -i "s#\(src=\"js/[a-z]*\.js\)\"#\1?v=${GITHUB_SHA::7}\"#g" _site/index.html
      # 원고 녹음용 무료 신경망 음성(MS 엣지 '소리 내어 읽기', edge-tts)
      - run: python3 -m pip install --user edge-tts==7.3.1
      # 녹음 다듬기(고음 낮추기, 스테레오)에 쓰는 ffmpeg: 러너에 없으면 설치
      - run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      # 음성 녹음 캐시: 같은 날 다시 배포해도 이미 녹음한 줄은 다시 녹음하지 않는다
      - uses: actions/cache@v4
        with:
          path: tts-cache
          key: tts-${{ github.run_id }}
          restore-keys: tts-
      # 신문사·농업·비료·국제/경제 헤드라인 → briefing.json(화면), briefing.txt(앱이 읽는 원고, 주말·공휴일엔 빈 파일)
      - name: News briefing
        timeout-minutes: 22 # 수집 몇 분 + 음성 녹음 (모든 본문 첫 녹음은 십 분 남짓, 같은 날 다시 하면 캐시로 금방)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          # 기사 '자세히': 기본은 본문 첫 문장(무료). 저장소 Settings → Variables에서 SUMMARY_MODE=claude로 바꾸면 Claude 요약(유료)
          SUMMARY_MODE: ${{ vars.SUMMARY_MODE }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 원고 녹음: 기본은 무료 엣지 음성. 비밀값 TYPECAST_API_KEY가 있으면 타입캐스트, GOOGLE_TTS_KEY가 있으면 구글 클라우드 음성.
          # Variables: TTS_ENGINE(edge·typecast·google·off로 고정), TTS_DAILY_CHARS(한 번에 녹음할 최대 글자 = 비용 상한), TTS_CONCURRENCY(동시 요청 수, 타입캐스트 무료 2·Lite 5)
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          TYPECAST_API_KEY: ${{ secrets.TYPECAST_API_KEY }}
          TTS_DAILY_CHARS: ${{ vars.TTS_DAILY_CHARS }}
          TTS_CONCURRENCY: ${{ vars.TTS_CONCURRENCY }}
          TTS_ENGINE: ${{ vars.TTS_ENGINE }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          TTS_CACHE: tts-cache
        run: node tools/collect.js _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # 올리기만 한 줄로 세우고, 새 것이 오면 앞선 것은 그만둔다: 2026-10-10 밤 배포 하나가 'waiting'에 멈춘 채 순서를 막아
  # 그 뒤 새벽 원고가 모두 대기·취소됐다
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
