# PR에서 출처·번역을 실제로 불러 보아 원고가 제대로 나오는지 확인한다 (배포는 하지 않는다)
name: News check

on:
  pull_request:
    paths: ['tools/**', 'feeds.json', 'tests/**', '.github/workflows/news-check.yml', 'android/app/src/main/java/**/Extras.java', 'android/app/src/test/java/**/ExtrasLive.java']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: python3 -m pip install --user edge-tts==7.3.1
      - name: Live collection
        timeout-minutes: 8
        env:
          SUMMARY_LIMIT: '30' # 요약은 앞의 8건만 시험한다 (기본 리드 방식, 무료)
          TTS_ENGINE: edge
          TTS_DAILY_CHARS: '600' # 엣지 음성 녹음이 되는지 몇 줄만 시험한다
        run: |
          node tools/collect.js out
          echo '----- 원고 -----'
          cat out/briefing.txt
          echo '----- 번역 원문 -----'
          node -e "const b=require('./out/briefing.json');for(const s of b.sections)for(const x of s.sources)for(const i of x.items)if(i.original)console.log(i.source+' | '+i.original+' => '+i.title)"
          echo '----- 자세히 (요약) -----'
          node -e "const b=require('./out/briefing.json');for(const s of b.sections)for(const x of s.sources)for(const i of x.items)if(i.summary)console.log('* '+i.title+'\n  '+i.summary)"
          echo '----- 숫자·기호 읽기 -----'
          node tools/pron-audit.js out/briefing.json | head -400
          echo '----- 음성 녹음 -----'
          ls -l out/audio 2>/dev/null | head -8 || echo '녹음 없음'
          echo '----- 수집 기록 -----'
          node -e "require('./out/briefing.json').log.forEach((l)=>console.log(l))"
      - name: Phone extras (언론사 직접 넣기, 농업 키워드)
        timeout-minutes: 3
        run: |
          curl -sSfo /tmp/json.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          J=android/app/src/main/java/io/github/kimyh1981/newsclipping
          javac -encoding UTF-8 -nowarn -d /tmp/ex -cp /tmp/json.jar $J/Brief.java $J/LessonLock.java $J/Extras.java android/app/src/test/java/io/github/kimyh1981/newsclipping/ExtrasLive.java
          java -cp /tmp/ex:/tmp/json.jar io.github.kimyh1981.newsclipping.ExtrasLive www.nongmin.com https://www.amnews.co.kr https://www.agrinet.co.kr/rss/allArticle.xml www.newsfarm.co.kr 키워드:비료 키워드:바이오플랜 키워드:미생물
