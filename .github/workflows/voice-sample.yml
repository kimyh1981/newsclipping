name: Voice sample
on:
  push:
    branches: [claude/project-thread-f6sqlk]
    paths: ['samples-text.txt']
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user edge-tts==7.3.1
      - run: |
          mkdir -p samples
          python3 -m edge_tts --voice ko-KR-SunHiNeural -f samples-text.txt --write-media samples/1_now_sunhi.mp3
          python3 -m edge_tts --voice ko-KR-InJoonNeural -f samples-text.txt --write-media samples/2_injoon_normal.mp3
          python3 -m edge_tts --voice ko-KR-InJoonNeural --rate=-8% -f samples-text.txt --write-media samples/3_injoon_slower8.mp3
          python3 -m edge_tts --voice ko-KR-InJoonNeural --rate=-15% -f samples-text.txt --write-media samples/4_injoon_slower15.mp3
          python3 -m edge_tts --voice ko-KR-HyunsuMultilingualNeural -f samples-text.txt --write-media samples/5_hyunsu.mp3 || true
          ls -l samples
          git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
          git add samples && git commit -m "voice samples" && git push
