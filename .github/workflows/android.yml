# 안드로이드 앱(APK)을 빌드한다. main에 반영되면 릴리스로 올려 설치 링크
# https://github.com/kimyh1981/newsclipping/releases/latest/download/newsclipping.apk 가 새 버전을 가리키게 한다.
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and APK
        working-directory: android
        run: gradle --no-daemon testReleaseUnitTest assembleRelease
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk newsclipping.apk
      - uses: actions/upload-artifact@v4
        with:
          name: newsclipping-apk
          path: newsclipping.apk
      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" newsclipping.apk --title "뉴스클리핑 $tag" --notes "갤럭시(안드로이드)용 앱. 휴대폰에서 newsclipping.apk를 받아 설치합니다." --latest
